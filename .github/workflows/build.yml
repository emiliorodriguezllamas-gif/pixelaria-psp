name: Build PSP EBOOT.PBP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EBOOT.PBP
        run: make
      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: PixelariaPocket-PSP
          path: EBOOT.PBP
