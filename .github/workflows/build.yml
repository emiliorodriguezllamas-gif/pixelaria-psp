name: Build PSP EBOOT.PBP

on:
  push:
  workflow_dispatch:

jobs:
  build-snd0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build atracdenc and encode SND0.AT3
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsndfile1-dev git
          git clone --depth 1 --recursive https://github.com/dcherednik/atracdenc.git /tmp/atracdenc
          cmake -S /tmp/atracdenc/src -B /tmp/atracdenc/build
          cmake --build /tmp/atracdenc/build -j
          /tmp/atracdenc/build/atracdenc -e atrac3 -i snd0.wav -o SND0.AT3 --bitrate 132
          ls -lh SND0.AT3
      - name: Upload SND0.AT3
        uses: actions/upload-artifact@v4
        with:
          name: snd0-at3
          path: SND0.AT3

  build:
    needs: build-snd0
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SND0.AT3
        uses: actions/download-artifact@v4
        with:
          name: snd0-at3
      - name: Build EBOOT.PBP
        run: make
      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: PixelariaPocket-PSP
          path: EBOOT.PBP
