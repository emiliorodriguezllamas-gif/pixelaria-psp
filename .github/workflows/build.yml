name: Build Nova Wing 64 PSP

on:
  push:
    branches: [ novawing64 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Encode SND0.AT3 if needed
        run: |
          if [ ! -f SND0.AT3 ] && [ -f snd0.wav ]; then
            if ! command -v atracdenc >/dev/null 2>&1; then
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache cmake g++ make git libsndfile-dev
              elif command -v apt-get >/dev/null 2>&1; then
                apt-get update && apt-get install -y cmake g++ make git libsndfile1-dev
              fi
              git clone --recursive --depth 1 https://github.com/dcherednik/atracdenc.git /tmp/atracdenc
              cmake -B /tmp/atracdenc/build /tmp/atracdenc/src
              cmake --build /tmp/atracdenc/build -j
              cp /tmp/atracdenc/build/atracdenc /usr/local/bin/
            fi
            atracdenc -e atrac3 -i snd0.wav -o SND0.AT3 --bitrate 132
          fi

      - name: Build EBOOT.PBP
        run: |
          make clean || true
          make -j$(nproc)
          ls -lh EBOOT.PBP

      - name: Upload EBOOT.PBP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaWing64-PSP
          path: EBOOT.PBP
